[project]
name = "korean-tokenizer"
version = "0.1.0"
description = "Hangul-awareness benchmarks for production LLM tokenizers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tokenizers>=0.19.0",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
extraPaths = ["src"]
